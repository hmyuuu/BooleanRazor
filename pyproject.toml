[project]
name = "booleanrazor-tools"
version = "0.1.0"
description = "Protocol, experiment, and HPC support for BooleanRazor"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = [
    "autoresearch",
    "research",
    "scripts/tests",
]
addopts = ["--strict-markers"]
